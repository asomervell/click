name: Publish clickmcp

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Require the tag to match cli/package.json
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node --input-type=module -e "import {readFileSync} from 'node:fs'; const version = JSON.parse(readFileSync('package.json','utf8')).version; const tag = process.env.GITHUB_REF_NAME.replace(/^v/, ''); if (version !== tag) { console.error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match cli/package.json ' + version); process.exit(1); }"
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
